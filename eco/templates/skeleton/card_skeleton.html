            <!-- Image placeholder -->

            <!-- Content placeholder -->

                    <div class="h-12 flex-1 bg-[#1a1a1a] rounded-xl animate-pulse"></div>
                    <div class="h-12 w-14 bg-[#1a1a1a] rounded-xl animate-pulse"></div>

        </div>
